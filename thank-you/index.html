<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You | Sara M. Jenkins</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%233b3437'/%3E%3Cpath d='M16 24s-9-5.5-9-11.2C7 8 13.1 7 16 11c2.9-4 9-3 9 1.8C25 18.5 16 24 16 24Z' fill='%23e7bfc4'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#3d3739;--deep:#2f292c;--rose:#d9a9b1;--rose-deep:#b87985;--blush:#f4e6e8;--paper:#fcfaf7;--serif:'Libre Caslon Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--blush);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65}
    a{color:inherit;text-decoration:none}
    .nav{padding:24px clamp(24px,5vw,76px);background:var(--deep);color:white}
    .brand{font-family:var(--serif);font-size:1.35rem;letter-spacing:.04em}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:96px 24px;text-align:center}
    .section-kicker{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--rose-deep);font-weight:600;margin-bottom:20px}
    h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.6rem,5vw,4.5rem);line-height:1.05;margin:0 0 20px}
    p{max-width:520px;margin:0 auto 32px;font-size:1.05rem}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 32px;border:1px solid var(--rose);font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:var(--rose);color:var(--deep);transition:.2s}
    .button:hover{transform:translateY(-2px)}
    footer{background:#2d282a;color:#ddd1d4;padding:36px clamp(24px,7vw,110px);font-size:.86rem}
    .footer-brand{font-family:var(--serif);font-size:1.25rem;color:white}
  </style>
</head>
<body>
  <header class="nav"><a class="brand" href="../">Sara M. Jenkins</a></header>
  <main>
    <div>
      <div class="section-kicker">Inquiry received</div>
      <h1>Thank you!</h1>
      <p>Your speaking invitation has been sent. Each invitation is prayerfully considered, and we look forward to connecting with you soon.</p>
      <a class="button" href="../">Return to the site</a>
    </div>
  </main>
  <footer><div class="footer-brand">Sara M. Jenkins</div></footer>
</body>
</html>
